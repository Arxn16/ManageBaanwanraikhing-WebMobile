<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>แก้ไขข้อมูลลูกค้า | บ้านแว่นไร่ขิง</title>
  <meta name="theme-color" content="#15803d">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="บ้านแว่นไร่ขิง">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/app.js" defer></script>
</head>

<body data-page="edit-customer" class="min-h-screen bg-green-50 p-3 sm:p-6 lg:p-10">

  <div class="mx-auto max-w-4xl">

    <header class="page-hero">
      <div class="relative z-10 flex items-start justify-between gap-3">
        <div>
          <p class="text-base font-medium text-green-100">บ้านแว่นไร่ขิง</p>
          <h1 id="page-title" class="mt-0.5 text-3xl font-bold sm:text-4xl">แก้ไขข้อมูลลูกค้า</h1>
          <p id="page-subtitle" class="mt-1 text-lg text-green-50">กำลังโหลด...</p>
        </div>
        <a href="/customer-list.html" class="hero-back">← รายชื่อ</a>
      </div>
    </header>

    <div class="grid grid-cols-1 gap-4 sm:gap-5">

      <section class="form-card big-fields">
        <div class="card-head">
          <span class="card-icon">👤</span>
          <h2 class="card-title">ข้อมูลลูกค้า</h2>
        </div>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <label class="field">ชื่อ<input id="name" autocomplete="off" placeholder="ชื่อ"></label>
          <label class="field">เบอร์โทร<input id="phone" type="tel" autocomplete="off" placeholder="เบอร์โทร"></label>
          <label class="field"><span id="date-label">วันที่</span><input id="date" type="date"></label>
          <label class="field">อายุ<input id="age" inputmode="numeric" autocomplete="off" placeholder="อายุ"></label>
          <label class="field">อาชีพ<input id="job" autocomplete="off" placeholder="อาชีพ"></label>
          <label class="field">โรคประจำตัว<input id="disease" autocomplete="off" placeholder="โรคประจำตัว"></label>
          <label class="field md:col-span-2">ที่อยู่<input id="address" autocomplete="off" placeholder="ที่อยู่"></label>
        </div>
      </section>

      <!-- เฉพาะตอน "บันทึกการมาครั้งใหม่" -->
      <div id="visit-section" class="hidden grid grid-cols-1 gap-4 sm:gap-5">
        <div class="flex justify-end">
          <button id="copy-last-rx" type="button" onclick="copyLastRx()" class="btn-outline hidden">📋 ใช้ค่าสายตาครั้งล่าสุด</button>
        </div>
        <div id="rx-editor"></div>
        <section class="form-card big-fields">
          <div class="card-head">
            <span class="card-icon">🧾</span>
            <h2 class="card-title">รายการสั่งทำ</h2>
          </div>
          <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
            <label class="field md:col-span-2">แว่นเก่า<input id="old_glasses" autocomplete="off" autocapitalize="off" placeholder="แว่นเก่า"></label>
            <label class="field md:col-span-2">รายละเอียดเพิ่มเติม (Re)<textarea id="detail" rows="3" placeholder="รายละเอียดเพิ่มเติม"></textarea></label>
            <label class="field">กรอบแว่น<input id="frame" autocomplete="off" placeholder="กรอบแว่น"></label>
            <label class="field">เลนส์<input id="lens" autocomplete="off" placeholder="เลนส์"></label>
          </div>
        </section>

        <section class="form-card big-fields">
          <div class="card-head">
            <span class="card-icon">💰</span>
            <div>
              <h2 class="card-title">ค่าใช้จ่าย (บาท)</h2>
              <p class="card-hint">คงเหลือคำนวณให้อัตโนมัติ</p>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 sm:gap-4">
            <label class="field">ราคา<input id="price" inputmode="decimal" oninput="calculateRemain()" placeholder="0"></label>
            <label class="field">มัดจำ<input id="deposit" inputmode="decimal" oninput="calculateRemain()" placeholder="0"></label>
            <label class="remain-tile col-span-2 sm:col-span-1">คงเหลือ<input id="remain" readonly tabindex="-1" placeholder="0" data-tone=""></label>
          </div>
        </section>
      </div>

    </div>

    <div id="new-visit-actions" class="mt-5 hidden sm:mt-6">
      <div class="sm:flex sm:justify-end">
        <button type="button" onclick="saveAsNewVisit(this)" class="btn-save">➕ บันทึกเป็นครั้งใหม่</button>
      </div>
    </div>

    <div id="edit-actions" class="mt-6 hidden flex flex-col gap-3 sm:flex-row sm:flex-wrap">
      <button type="button" onclick="updateCustomer(this)" class="btn-save">💾 บันทึกการแก้ไข</button>
      <button type="button" onclick="showEditHistory()" class="btn-outline">📋 ดูประวัติ</button>
      <a id="new-visit-link" href="#" class="btn bg-blue-700 text-lg hover:bg-blue-800">➕ เพิ่มการมาครั้งใหม่</a>
      <button type="button" onclick="deleteCustomerFromEdit(this)" class="btn bg-red-600 text-lg hover:bg-red-700 sm:ml-auto">🗑️ ลบลูกค้า</button>
    </div>

  </div>

</body>
</html>
