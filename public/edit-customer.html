<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>แก้ไขข้อมูลลูกค้า | บ้านแว่นไร่ขิง</title>
  <meta name="theme-color" content="#db2777">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="บ้านแว่นไร่ขิง">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/app.js" defer></script>
</head>

<body data-page="edit-customer" class="min-h-screen bg-pink-100 p-3 sm:p-6 lg:p-10">

  <div class="mx-auto max-w-4xl rounded-2xl bg-white p-4 shadow sm:p-6">

    <div class="mb-6 flex items-start justify-between gap-3">
      <div>
        <h1 id="page-title" class="text-2xl font-bold sm:text-3xl">แก้ไขข้อมูลลูกค้า</h1>
        <p id="page-subtitle" class="text-gray-500">กำลังโหลด...</p>
      </div>
      <a href="/customer-list.html" class="btn-light shrink-0">← รายชื่อ</a>
    </div>

    <div class="grid grid-cols-1 gap-4">

      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <label class="field">ชื่อ<input id="name" autocomplete="off" placeholder="ชื่อ"></label>
        <label class="field">เบอร์โทร<input id="phone" type="tel" autocomplete="off" placeholder="เบอร์โทร"></label>
        <label class="field"><span id="date-label">วันที่</span><input id="date" type="date"></label>
        <label class="field">อายุ<input id="age" inputmode="numeric" autocomplete="off" placeholder="อายุ"></label>
        <label class="field">อาชีพ<input id="job" autocomplete="off" placeholder="อาชีพ"></label>
        <label class="field md:col-span-2">ที่อยู่<input id="address" autocomplete="off" placeholder="ที่อยู่"></label>
      </div>

      <!-- เฉพาะตอน "บันทึกการมาครั้งใหม่" -->
      <div id="visit-section" class="hidden grid grid-cols-1 gap-4">
        <div class="flex justify-end">
          <button id="copy-last-rx" type="button" onclick="copyLastRx()" class="btn-light hidden text-sm">📋 ใช้ค่าสายตาครั้งล่าสุด</button>
        </div>
        <div id="rx-editor"></div>
        <label class="field">รายละเอียดเพิ่มเติม<textarea id="detail" rows="3" placeholder="รายละเอียดเพิ่มเติม"></textarea></label>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <label class="field">กรอบแว่น<input id="frame" autocomplete="off" placeholder="กรอบแว่น"></label>
          <label class="field">เลนส์<input id="lens" autocomplete="off" placeholder="เลนส์"></label>
        </div>
        <div class="grid grid-cols-3 gap-3 rounded-2xl bg-gray-50 p-3 sm:gap-4 sm:p-4">
          <label class="field">ราคา<input id="price" inputmode="decimal" oninput="calculateRemain()" placeholder="0"></label>
          <label class="field">มัดจำ<input id="deposit" inputmode="decimal" oninput="calculateRemain()" placeholder="0"></label>
          <label class="field">คงเหลือ<input id="remain" readonly tabindex="-1" placeholder="0"></label>
        </div>
      </div>

    </div>

    <div id="new-visit-actions" class="mt-6 hidden">
      <button type="button" onclick="saveAsNewVisit(this)" class="btn w-full bg-blue-500 text-lg hover:bg-blue-600 sm:w-auto">
        ➕ บันทึกเป็นครั้งใหม่
      </button>
    </div>

    <div id="edit-actions" class="mt-6 hidden flex flex-col gap-3 sm:flex-row">
      <button type="button" onclick="updateCustomer(this)" class="btn bg-green-500 text-lg hover:bg-green-600">💾 บันทึกการแก้ไข</button>
      <button type="button" onclick="showEditHistory()" class="btn bg-pink-500 text-lg hover:bg-pink-600">📋 ดูประวัติ</button>
      <a id="new-visit-link" href="#" class="btn bg-indigo-500 text-lg hover:bg-indigo-600">➕ เพิ่มการมาครั้งใหม่</a>
      <button type="button" onclick="deleteCustomerFromEdit(this)" class="btn bg-red-500 text-lg hover:bg-red-600 sm:ml-auto">🗑️ ลบลูกค้า</button>
    </div>

  </div>

</body>
</html>
