<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>เข้าสู่ระบบ | บ้านแว่นไร่ขิง</title>
  <meta name="theme-color" content="#db2777">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="บ้านแว่นไร่ขิง">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/app.js" defer></script>
</head>

<body data-page="login" class="flex min-h-screen items-center justify-center bg-pink-100 p-4">

  <form id="login-form" class="w-full max-w-sm rounded-2xl bg-white p-6 text-center shadow-xl sm:p-8">
    <img src="/icons/icon-192.png" alt="" class="mx-auto mb-4 h-16 w-16 rounded-2xl">
    <h1 class="text-2xl font-bold">บ้านแว่นไร่ขิง</h1>
    <p class="mb-6 mt-1 text-gray-500">กรอก PIN เพื่อเข้าใช้งาน</p>

    <label for="pin" class="sr-only">PIN</label>
    <input id="pin" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="32" required
      class="w-full rounded-xl border border-gray-300 p-3 text-center text-2xl tracking-[0.5em] focus:border-pink-500 focus:outline-none focus:ring-2 focus:ring-pink-200">

    <button type="submit" class="btn mt-4 w-full bg-pink-600 hover:bg-pink-700">เข้าสู่ระบบ</button>
    <p id="login-error" class="mt-3 min-h-[1.5rem] text-sm text-red-600" role="alert"></p>
  </form>

</body>
</html>
