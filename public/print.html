<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ใบค่าสายตา | บ้านแว่นไร่ขิง</title>
  <meta name="theme-color" content="#02923f">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <style>
    /* ใบค่าสายตา — พิมพ์ได้ทั้งกระดาษ A5 และใบเสร็จ 80 มม. (เลือกที่แถบด้านบน) */
    :root { --green: #02923f; --green-dark: #046b30; --line: #b9dcc6; --ink: #1f2933; --muted: #5f6b76; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: #eef2f0; color: var(--ink);
      font-family: "Sarabun", "Noto Sans Thai", "Noto Sans Thai UI", "Leelawadee UI", "Thonburi", "Tahoma", sans-serif;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .toolbar {
      position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 10px 12px; background: #fff; border-bottom: 1px solid #dfe7e3; box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .toolbar .grow { flex: 1 1 auto; }
    .tb-btn, .tb-select, .tb-check {
      font: inherit; font-size: 16px; border-radius: 12px; padding: 10px 14px; border: 1px solid #cfd8d3; background: #fff; color: var(--ink);
    }
    .tb-btn { cursor: pointer; }
    .tb-print { background: var(--green); border-color: var(--green); color: #fff; font-weight: 700; }
    .tb-check { display: inline-flex; align-items: center; gap: 6px; }
    .tb-check input { width: 20px; height: 20px; accent-color: var(--green); }
    .status { max-width: 520px; margin: 40px auto; padding: 20px; text-align: center; color: var(--muted); font-size: 18px; }
    .status.error { color: #b42318; }
    .stage { padding: 16px 8px 40px; overflow-x: auto; }

    .sheet { background: #fff; margin: 0 auto; color: var(--ink); box-shadow: 0 6px 24px rgba(0,0,0,.12); }
    .lbl { color: var(--muted); }
    .empty { color: #b7c0c7; }

    /* ---------- หัวใบ: โลโก้เล็กที่มุมซ้าย ชื่อเอกสารที่มุมขวา ---------- */
    .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 4mm; border-bottom: 0.8mm solid var(--green); }
    .brand { display: flex; align-items: center; gap: 2.5mm; min-width: 0; }
    .logo { height: auto; flex: none; }
    .doc { flex: none; text-align: right; }
    .doc h1 { margin: 0 0 1mm; color: var(--green-dark); letter-spacing: .02em; line-height: 1.2; }
    .meta { line-height: 1.45; }

    /* ---------- A5 ---------- */
    body[data-paper="a5"] .sheet { width: 148mm; min-height: 210mm; padding: 8mm 9mm; font-size: 12.5pt; }
    body[data-paper="a5"] .head { padding-bottom: 3mm; }
    body[data-paper="a5"] .logo { width: 16mm; }
    body[data-paper="a5"] .shop-name { font-size: 13pt; }
    body[data-paper="a5"] .shop-en { font-size: 8.5pt; }
    body[data-paper="a5"] .doc h1 { font-size: 16pt; }
    body[data-paper="a5"] .meta { font-size: 10.5pt; }
    body[data-paper="a5"] .customer { display: grid; grid-template-columns: 1fr auto; gap: 2mm 6mm; margin: 5mm 0 4mm; }
    body[data-paper="a5"] .customer .wide { grid-column: 1 / -1; }
    body[data-paper="a5"] .rx { font-size: 13pt; }
    body[data-paper="a5"] .rx td, body[data-paper="a5"] .rx th { padding: 2.6mm 1mm; }
    body[data-paper="a5"] .money { grid-template-columns: repeat(3, 1fr); }
    body[data-paper="a5"] .foot { margin-top: 10mm; }

    /* ---------- ใบเสร็จ 80 มม. ---------- */
    body[data-paper="receipt"] .sheet { width: 76mm; padding: 2mm 2mm 3mm; font-size: 9.5pt; line-height: 1.35; }
    body[data-paper="receipt"] .head { display: block; padding-bottom: 1.5mm; border-bottom-width: 0.5mm; }
    body[data-paper="receipt"] .logo { width: 12mm; }
    body[data-paper="receipt"] .brand { gap: 2mm; }
    body[data-paper="receipt"] .shop-name { font-size: 11pt; }
    body[data-paper="receipt"] .shop-en { font-size: 7.5pt; }
    body[data-paper="receipt"] .doc { text-align: center; margin-top: 2mm; }
    body[data-paper="receipt"] .doc h1 { font-size: 13pt; }
    body[data-paper="receipt"] .meta { display: inline; font-size: 9pt; margin: 0 1.5mm; }
    body[data-paper="receipt"] .customer { display: grid; grid-template-columns: 1fr auto; gap: 0.5mm 2mm; margin: 2.5mm 0 2mm; }
    body[data-paper="receipt"] .customer .wide { grid-column: 1 / -1; }
    body[data-paper="receipt"] .rx { font-size: 8.5pt; }
    body[data-paper="receipt"] .rx td, body[data-paper="receipt"] .rx th { padding: 1.1mm 0.2mm; }
    body[data-paper="receipt"] .rx .eye small { display: none; }
    body[data-paper="receipt"] .order { margin-top: 2mm; gap: 0.6mm 2mm; }
    body[data-paper="receipt"] .money { grid-template-columns: 1fr; gap: 0; margin-top: 2mm; border: 0.3mm solid var(--line); border-radius: 1.5mm; padding: 1mm 2mm; }
    body[data-paper="receipt"] .money div { display: flex; justify-content: space-between; align-items: baseline; border: 0; padding: 0.4mm 0; text-align: left; }
    body[data-paper="receipt"] .money span { display: inline; font-size: 1em; }
    body[data-paper="receipt"] .foot { margin-top: 7mm; text-align: center; }
    body[data-paper="receipt"] .sign { flex-direction: column; align-items: center; gap: 0.5mm; }
    body[data-paper="receipt"] .sign .first { display: none; }
    body[data-paper="receipt"] .sign .dots { min-width: 50mm; }
    body[data-paper="receipt"] .thanks { margin-top: 2.5mm; font-size: .85em; }
    body[data-paper="receipt"] .thanks .sep { display: block; height: 0; overflow: hidden; }

    .shop-name { font-weight: 800; color: var(--green-dark); line-height: 1.15; }
    .shop-en { color: var(--green); font-weight: 600; letter-spacing: .04em; }
    .shop-line { color: var(--muted); font-size: .88em; line-height: 1.35; }
    .customer b { font-weight: 700; }

    .rx { width: 100%; border-collapse: collapse; text-align: center; table-layout: fixed; }
    .rx th, .rx td { border: 0.3mm solid var(--line); }
    .rx thead th { background: #e7f5ec; color: var(--green-dark); font-weight: 700; }
    .rx td { font-weight: 700; font-variant-numeric: tabular-nums; word-break: break-word; }
    .rx .eye { width: 15%; font-weight: 800; line-height: 1.1; }
    .rx .eye small { display: block; font-weight: 500; font-size: .7em; color: var(--muted); }
    .rx .eye.r { color: var(--green-dark); }
    .rx .eye.l { color: #1d4ed8; }

    .order { display: grid; grid-template-columns: max-content 1fr; gap: 1.5mm 3mm; margin-top: 4mm; }
    .order .val { white-space: pre-line; word-break: break-word; }

    .money { display: grid; gap: 2mm; margin-top: 4mm; }
    .money div { border: 0.3mm solid var(--line); border-radius: 2mm; padding: 2mm; text-align: center; }
    .money span { display: block; color: var(--muted); font-size: .85em; }
    .money b { font-variant-numeric: tabular-nums; font-size: 1.05em; }
    .money .due b { color: #b42318; }
    .money .paid-all b { color: var(--green-dark); }
    body.hide-price .money { display: none; }

    .foot { color: var(--muted); }
    .sign { display: flex; justify-content: flex-end; gap: 2mm; align-items: flex-end; color: var(--ink); }
    .sign .dots { display: inline-block; min-width: 42mm; border-bottom: 0.3mm dotted #7b8792; height: 1.2em; }
    .thanks { margin-top: 4mm; text-align: center; font-size: .9em; }

    @media print {
      body { background: #fff; }
      .toolbar, .status { display: none !important; }
      .stage { padding: 0; overflow: visible; }
      .sheet { box-shadow: none; margin: 0; min-height: 0 !important; }
    }
  </style>
  <style id="page-size">@page { size: A5 portrait; margin: 0; }</style>
</head>

<body data-paper="a5">
  <div class="toolbar">
    <button type="button" class="tb-btn" id="back">← กลับ</button>
    <span class="grow"></span>
    <select id="paper" class="tb-select" aria-label="ขนาดกระดาษ">
      <option value="a5">กระดาษ A5 / A4</option>
      <option value="receipt">ใบเสร็จ 80 มม.</option>
    </select>
    <label class="tb-check"><input type="checkbox" id="show-price" checked> แสดงราคา</label>
    <button type="button" class="tb-btn tb-print" id="print">🖨️ พิมพ์</button>
  </div>

  <p class="status" id="status">กำลังโหลด...</p>

  <div class="stage" id="stage" hidden>
    <div class="sheet">
      <header class="head">
        <div class="brand">
          <img src="/icons/logo.png" class="logo" alt="บ้านแว่นไร่ขิง">
          <div class="shop">
            <div class="shop-name" id="shop-name">บ้านแว่นไร่ขิง</div>
            <div class="shop-en" id="shop-en">Banwaenraikhing</div>
            <div class="shop-line" id="shop-address" hidden></div>
            <div class="shop-line" id="shop-contact" hidden></div>
          </div>
        </div>
        <div class="doc">
          <h1>ใบค่าสายตา</h1>
          <div class="meta"><span class="lbl">วันที่</span> <b id="date"></b></div>
          <div class="meta"><span class="lbl">เลขที่</span> <b id="no"></b></div>
        </div>
      </header>

      <div class="customer">
        <div><span class="lbl">ชื่อ</span> <b id="c-name"></b></div>
        <div><span class="lbl">อายุ</span> <b id="c-age"></b></div>
        <div class="wide"><span class="lbl">โทร</span> <b id="c-phone"></b></div>
      </div>

      <table class="rx">
        <thead>
          <tr><th class="eye"></th><th>SPH</th><th>CYL</th><th>AX</th><th>VA</th><th>ADD</th><th>PD/SH</th></tr>
        </thead>
        <tbody id="rx-body"></tbody>
      </table>

      <div class="order" id="order"></div>

      <div class="money" id="money">
        <div><span>ราคา</span> <b id="price"></b></div>
        <div><span>ชำระแล้ว</span> <b id="paid"></b></div>
        <div id="remain-box" class="due"><span>คงเหลือ</span> <b id="remain"></b></div>
      </div>

      <footer class="foot">
        <div class="sign"><span class="first">ลงชื่อ</span><span class="dots"></span><span>ผู้ตรวจวัดสายตา</span></div>
        <div class="thanks" id="thanks"></div>
      </footer>
    </div>
  </div>

  <script>
    (function () {
      'use strict'
      const $ = id => document.getElementById(id)
      const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }
      const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ESC[c])
      const num = v => { const n = Number(String(v ?? '').replace(/[,\s]/g, '')); return Number.isFinite(n) ? n : 0 }
      const money = v => num(v).toLocaleString('th-TH', { maximumFractionDigits: 2 })
      const orEmpty = v => (String(v ?? '').trim() ? esc(v) : '<span class="empty">–</span>')
      const store = {
        get (k, d) { try { return localStorage.getItem(k) ?? d } catch (_) { return d } },
        set (k, v) { try { localStorage.setItem(k, v) } catch (_) { /* ไม่เป็นไร */ } }
      }

      function thaiDate (iso) {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''))
        if (!m) return iso || '-'
        return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' })
      }

      async function get (url) {
        const res = await fetch(url, { credentials: 'same-origin', headers: { 'X-Requested-With': 'bw' } })
        if (res.status === 401) {
          location.href = '/login.html?next=' + encodeURIComponent(location.pathname + location.search)
          throw new Error('กรุณาเข้าสู่ระบบ')
        }
        let data = null
        try { data = await res.json() } catch (_) { /* ไม่ใช่ JSON */ }
        if (!res.ok) throw new Error((data && data.error) || 'โหลดข้อมูลไม่ได้')
        return data
      }

      // ขนาดกระดาษและการแสดงราคา (จำไว้ในเครื่องนี้)
      function applyPaper (paper) {
        document.body.dataset.paper = paper
        $('page-size').textContent = paper === 'receipt'
          ? '@page { size: 80mm 180mm; margin: 2mm; }'
          : '@page { size: A5 portrait; margin: 0; }'
        $('paper').value = paper
        store.set('bw-print-paper', paper)
      }
      function applyPrice (on) {
        document.body.classList.toggle('hide-price', !on)
        $('show-price').checked = on
        store.set('bw-print-price', on ? '1' : '0')
      }
      applyPaper(store.get('bw-print-paper', 'a5') === 'receipt' ? 'receipt' : 'a5')
      applyPrice(store.get('bw-print-price', '1') !== '0')
      $('paper').addEventListener('change', e => applyPaper(e.target.value))
      $('show-price').addEventListener('change', e => applyPrice(e.target.checked))
      $('print').addEventListener('click', () => window.print())
      $('back').addEventListener('click', () => {
        if (history.length > 1) history.back()
        else location.href = '/customer-list.html'
      })

      async function load () {
        const id = Number(new URLSearchParams(location.search).get('visit'))
        if (!Number.isInteger(id) || id <= 0) throw new Error('ไม่พบรายการที่จะพิมพ์')
        const [data, shop] = await Promise.all([
          get(`/api/customers/${id}/visits`),
          fetch('/shop.json').then(r => (r.ok ? r.json() : {})).catch(() => ({}))
        ])
        const c = data.customer
        const v = data.visits.find(x => x.id === id) || data.visits[data.visits.length - 1]

        if (shop.name) $('shop-name').textContent = shop.name
        if (shop.nameEn !== undefined) $('shop-en').textContent = shop.nameEn
        if (shop.address) { $('shop-address').textContent = shop.address; $('shop-address').hidden = false }
        const contact = [shop.phone && `โทร ${shop.phone}`, shop.line && `LINE ${shop.line}`].filter(Boolean).join(' · ')
        if (contact) { $('shop-contact').textContent = contact; $('shop-contact').hidden = false }
        $('thanks').innerHTML = String(shop.footer ?? 'ขอบคุณที่ใช้บริการ').split(' · ').map(esc).join('<span class="sep"> · </span>')

        $('date').textContent = thaiDate(v.date)
        $('no').textContent = String(v.id)
        $('c-name').textContent = c.name || '-'
        $('c-age').textContent = c.age ? `${c.age} ปี` : '-'
        $('c-phone').textContent = c.phone || '-'

        const cols = ['sph', 'cyl', 'ax', 'va', 'add', 'pd']
        const eye = (side, label, th) => `<tr><th class="eye ${side}">${label}<small>${th}</small></th>${cols.map(k => `<td>${orEmpty(v[`${side}_${k}`])}</td>`).join('')}</tr>`
        $('rx-body').innerHTML = eye('r', 'R', 'ตาขวา') + eye('l', 'L', 'ตาซ้าย')

        const rows = [['กรอบแว่น', v.frame], ['เลนส์', v.lens], ['หมายเหตุ', v.detail]]
          .filter(([, x]) => String(x ?? '').trim())
          .map(([label, x]) => `<span class="lbl">${label}</span><span class="val">${esc(x)}</span>`)
        $('order').innerHTML = rows.join('')
        $('order').hidden = rows.length === 0

        const remain = num(v.price) - num(v.deposit)
        $('price').textContent = `${money(v.price)} บาท`
        $('paid').textContent = `${money(v.deposit)} บาท`
        $('remain').textContent = remain > 0 ? `${money(remain)} บาท` : 'ชำระครบ'
        $('remain-box').className = remain > 0 ? 'due' : 'paid-all'

        document.title = `ใบค่าสายตา ${c.name || ''} ${v.date || ''}`.trim()
        $('status').hidden = true
        $('stage').hidden = false
      }

      load().catch(err => {
        $('status').textContent = err.message
        $('status').classList.add('error')
      })
    })()
  </script>
</body>
</html>
